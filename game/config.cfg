; Shopkeeper runtime config — difficulty and layout knobs, no code.
; Loaded at runtime with ConfigFile (see scripts/game_config.gd). NOTHING here is
; hard-coded in the game; change a value, restart, and the behavior changes.
; All values are sensible v1 defaults tuned for a 4-year-old.

[placeholder]
; Size of the Phase 1 seam-demo square (scenes/main.tscn), in design pixels
; (authored at 1920x1080). Phase 1 only. The game loop (Phase 2) ignores this.
box_size_px=220

[interaction]
; How she moves an item: "drag" = touch it and drag it onto the customer;
; "tap_tap" = tap the item, then tap the customer. drag is the default.
interaction_mode="drag"
; Item pick target as a fraction of screen WIDTH. Bigger = easier to grab.
; Large for little hands. The visible sprite can be smaller than this hit box.
hit_box_size=0.22
; Customer drop zone width as a fraction of screen width. The whole left strip
; is the drop target (she just has to get the item "over to the customer").
drop_zone_size=0.33

[session]
; Successful deliveries before "closing time".
rounds_per_session=10
; How many items sit on the shelf at once (2..8). More items = harder to find.
items_on_shelf=6
; Glow the correct item on the shelf as a hint, but only for the first few
; rounds (see hint_rounds). "on" | "off".
hint_glow="on"
; Glow-hint applies for this many opening rounds, then stops (training wheels).
hint_rounds=3
; Re-shuffle which slot holds which item every N rounds, so it isn't rote.
shuffle_every=3

[voice]
; Playback speed multiplier for the (Phase 3) pre-rendered voice lines.
voice_speed=1.0
