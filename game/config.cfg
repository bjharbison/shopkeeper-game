; Shopkeeper runtime config — difficulty and layout knobs, no code.
; Loaded at runtime (ConfigFile). Phases 2+ read dwell/zone/session values here;
; Phase 1 only uses placeholder.box_size_px. All values are sensible v1 defaults.

[placeholder]
; Size of the Phase 1 draggable square, in design pixels (authored at 1920x1080).
box_size_px=220

[dwell]
; Hold-still time to grab an item off the shelf, and the shorter time to hand it
; to a customer. Seconds. (Used from Phase 2.)
grab_seconds=0.8
give_seconds=0.5

[zones]
; Target hit-box size as a fraction of screen width. Large for a 4-year-old;
; shrink over sessions if it gets too easy. (Used from Phase 2.)
hit_box_fraction=0.22

[session]
; Rounds before "closing time", and how many items sit on the shelf at once.
rounds=10
shelf_items=6
; Glow hint on the correct item for early rounds.
hint_glow=true

[voice]
; Playback speed multiplier for pre-rendered voice lines.
speed=1.0
